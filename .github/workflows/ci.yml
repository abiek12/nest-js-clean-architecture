name: CI

on:
  push:
    branches: ['main', 'staging', 'develop']
  pull_request:
    branches: ['main', 'staging', 'develop']

jobs:
  ci:
    name: Lint + Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Biome check
        run: npx biome ci .

      - name: Run tests
        run: npm run test